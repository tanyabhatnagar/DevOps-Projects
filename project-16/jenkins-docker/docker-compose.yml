version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    ports:
      - 8081:8080
      - 50000:50000
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ../:/home/project               # <-- Mount project-16 into Jenkins
    user: root
    networks:
      - jenkins_net

  dind:
    image: docker:dind
    container_name: docker-dind
    privileged: true
    restart: unless-stopped
    networks:
      - jenkins_net

volumes:
  jenkins_home:

networks:
  jenkins_net:
